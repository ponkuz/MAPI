[project]
name = "stock-ai-scout-mapi"
version = "0.3.4"
description = "Experimental Market Anomaly Pressure Index (MAPI) research module for Stock AI Scout."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["mapi*"]
